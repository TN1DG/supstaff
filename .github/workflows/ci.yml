name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Route types (PageProps / LayoutProps) are generated, not committed;
      # tsc fails on a fresh checkout without them.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      # Includes the migration tests (every drizzle/*.sql applied to PGlite).
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-not-a-real-secret
